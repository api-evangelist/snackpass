aid: snackpass
name: Snackpass
description: >-
  Snackpass is an all-in-one marketing, point-of-sale (POS), and payments platform built for
  quick-service and fast-casual restaurants. It unifies front-of-house and back-of-house operations
  in one system: cloud POS, integrated card and mobile payments, self-serve kiosks, online and QR/table
  ordering, a consumer mobile app, kitchen display systems, loyalty and rewards, SMS/marketing automation,
  and commission-free delivery. Snackpass serves thousands of restaurants from independent boba and coffee
  shops to national franchises and has facilitated tens of millions of guest transactions. The company is
  privately held and backed by a16z, Craft Ventures, and General Catalyst. Snackpass does not publish a
  public developer API, OpenAPI specification, SDKs, or a developer portal; third-party ordering and
  delivery integrations (Uber Eats, DoorDash, GrubHub) are brokered through partners such as Deliverect
  and GetOrder rather than a documented public API surface.
